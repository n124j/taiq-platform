<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — TaIQ</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png"/>
  <link rel="shortcut icon" href="images/favicon.ico"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --brand:#0052cc; --teal:#00b4d8; --trans:.3s cubic-bezier(.4,0,.2,1);
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      font-family:'DM Sans',sans-serif;
      background:#050c1f; color:white;
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; justify-content:center; overflow:hidden; position:relative;
    }
    .bg { position:fixed; inset:0; pointer-events:none; z-index:0; }
    .bg-orb { position:absolute; border-radius:50%; filter:blur(80px); opacity:.45; }
    .bg-orb-1 {
      width:700px; height:700px;
      background:radial-gradient(circle,rgba(0,82,204,.5) 0%,transparent 70%);
      top:-200px; right:-150px; animation:float1 10s ease-in-out infinite;
    }
    .bg-orb-2 {
      width:500px; height:500px;
      background:radial-gradient(circle,rgba(0,180,216,.4) 0%,transparent 70%);
      bottom:-100px; left:-100px; animation:float2 13s ease-in-out infinite;
    }
    .bg-grid {
      position:absolute; inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size:60px 60px;
    }
    @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,-30px)} }
    @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-25px,25px)} }

    .card {
      position:relative; z-index:1; text-align:center;
      max-width:460px; width:calc(100% - 3rem);
      padding:3rem 2.5rem;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.1);
      border-radius:24px; backdrop-filter:blur(20px);
      animation:slideUp .7s ease both;
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }

    .logo {
      display:inline-flex; align-items:center;
      margin-bottom:2rem; text-decoration:none;
    }
    .logo img { height:36px; width:auto; display:block; }

    .icon-wrap {
      width:90px; height:90px; border-radius:50%;
      background:rgba(255,255,255,.07);
      border:1.5px solid rgba(255,255,255,.12);
      display:flex; align-items:center; justify-content:center;
      font-size:2.8rem; margin:0 auto 1.75rem;
    }
    .icon-wrap.success { border-color:rgba(74,222,128,.4); background:rgba(74,222,128,.08); }
    .icon-wrap.error   { border-color:rgba(248,113,113,.4); background:rgba(248,113,113,.08); }

    h1 { font-family:'Syne',sans-serif; font-size:clamp(1.5rem,4vw,2rem); font-weight:800; margin-bottom:.75rem; text-align:center; }
    h1 .green { color:#4ade80; }
    h1 .red   { color:#f87171; }

    .message { font-size:.95rem; color:rgba(255,255,255,.6); line-height:1.7; margin-bottom:2rem; text-align:center; }

    form { text-align:left; }
    .form-group { margin-bottom:1.1rem; }
    .form-label { display:block; font-size:.83rem; font-weight:500; margin-bottom:.4rem; color:rgba(255,255,255,.7); }
    .form-input {
      width:100%; padding:.8rem 1rem; border-radius:12px;
      border:1.5px solid rgba(255,255,255,.15);
      background:rgba(255,255,255,.06); color:white;
      font:inherit; font-size:.92rem; outline:none; transition:border-color var(--trans);
    }
    .form-input::placeholder { color:rgba(255,255,255,.3); }
    .form-input:focus { border-color:var(--brand); }
    .hint { font-size:.75rem; font-weight:500; min-height:1em; margin-top:.3rem; }

    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
      width:100%; padding:.85rem 2rem; border-radius:9999px;
      font:inherit; font-size:.92rem; font-weight:600;
      cursor:pointer; text-decoration:none; transition:all var(--trans);
      border:none; margin-top:.5rem;
    }
    .btn-primary { background:var(--brand); color:white; }
    .btn-primary:hover { background:#0040a0; transform:translateY(-1px); }
    .btn-primary:disabled { opacity:.6; cursor:not-allowed; transform:none; }

    .actions { display:flex; flex-direction:column; gap:.75rem; }

    footer {
      position:relative; z-index:1; margin-top:1.5rem;
      font-size:.75rem; color:rgba(255,255,255,.25); text-align:center;
    }
    footer a { color:rgba(255,255,255,.4); text-decoration:none; }
    footer a:hover { color:rgba(255,255,255,.7); }
  </style>
</head>
<body>

<div class="bg">
  <div class="bg-grid"></div>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
</div>

<div class="card">
  <a href="index.html" class="logo">
    <img src="images/logo-light.png" alt="TaIQ"/>
  </a>

  <div id="formView">
    <h1>Choose a new password</h1>
    <p class="message">Your new password must be at least 8 characters.</p>

    <form id="resetForm" onsubmit="event.preventDefault(); submitReset();">
      <div class="form-group">
        <label class="form-label" for="newPassword">New Password</label>
        <input type="password" class="form-input" id="newPassword" placeholder="Min 8 characters" autocomplete="new-password" required/>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <input type="password" class="form-input" id="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" required/>
        <div class="hint" id="confirmHint"></div>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Reset Password</button>
    </form>
  </div>

  <div id="resultView" style="display:none">
    <div class="icon-wrap" id="resultIcon">⏳</div>
    <h1 id="resultTitle"></h1>
    <p class="message" id="resultMessage"></p>
    <div class="actions" id="resultActions"></div>
  </div>
</div>

<footer>
  © 2025 TaIQ Inc. ·
  <a href="privacy-policy.html">Privacy</a> ·
  <a href="terms-of-service.html">Terms</a>
</footer>

<script>
  const API = '/api/v1';
  const token = new URLSearchParams(window.location.search).get('token');

  document.getElementById('confirmPassword').addEventListener('input', function () {
    const hint = document.getElementById('confirmHint');
    const pwd = document.getElementById('newPassword').value;
    if (!this.value) { hint.textContent = ''; return; }
    if (this.value === pwd) {
      hint.textContent = '✓ Passwords match';
      hint.style.color = '#4ade80';
    } else {
      hint.textContent = '✗ Passwords do not match';
      hint.style.color = '#f87171';
    }
  });

  function showResult({icon, iconClass, title, titleClass, message, actionsHtml}) {
    document.getElementById('formView').style.display = 'none';
    const resultIcon = document.getElementById('resultIcon');
    resultIcon.textContent = icon;
    resultIcon.className = `icon-wrap ${iconClass}`;
    document.getElementById('resultTitle').innerHTML = `<span class="${titleClass}">${title}</span>`;
    document.getElementById('resultMessage').textContent = message;
    document.getElementById('resultActions').innerHTML = actionsHtml;
    document.getElementById('resultView').style.display = 'block';
  }

  if (!token) {
    showResult({
      icon: '⚠️', iconClass: 'error',
      title: 'Invalid Link', titleClass: 'red',
      message: 'No reset token found. Please request a new password reset link.',
      actionsHtml: `<a href="forgot-password.html" class="btn btn-primary">Request New Link</a>`,
    });
  }

  async function submitReset() {
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword.length < 8) {
      document.getElementById('confirmHint').textContent = '';
      alert('Password must be at least 8 characters');
      return;
    }
    if (newPassword !== confirmPassword) {
      document.getElementById('confirmHint').textContent = '✗ Passwords do not match';
      document.getElementById('confirmHint').style.color = '#f87171';
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Resetting…';

    try {
      const r = await fetch(`${API}/auth/reset-password`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({token, new_password: newPassword}),
      });
      const data = await r.json().catch(() => ({}));

      if (r.ok) {
        showResult({
          icon: '✅', iconClass: 'success',
          title: 'Password Reset!', titleClass: 'green',
          message: 'Your password has been updated. You can now sign in with your new password.',
          actionsHtml: `<a href="index.html?openLogin=1" class="btn btn-primary">Sign In</a>`,
        });
      } else {
        showResult({
          icon: '❌', iconClass: 'error',
          title: 'Reset Failed', titleClass: 'red',
          message: data.detail || 'This link is invalid or has expired. Please request a new one.',
          actionsHtml: `<a href="forgot-password.html" class="btn btn-primary">Request New Link</a>`,
        });
      }
    } catch {
      showResult({
        icon: '⚠️', iconClass: 'error',
        title: 'Connection Error', titleClass: 'red',
        message: 'Could not reach the server. Please check your connection and try again.',
        actionsHtml: `<button class="btn btn-primary" onclick="location.reload()">Try Again</button>`,
      });
    } finally {
      btn.disabled = false;
      btn.textContent = 'Reset Password';
    }
  }
</script>
</body>
</html>
